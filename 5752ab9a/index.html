<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,noarchive,nofollow">
<title>请输入访问口令</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#1a2f52 0%,#101d36 46%,#0a1220 100%);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
/* 落雪:两层伪元素只动 transform,循环下落 */
body::before,body::after{content:'';position:fixed;left:-10%;top:-30vh;width:120%;height:60vh;pointer-events:none;
  background-image:radial-gradient(2px 2px at 12% 30%,rgba(255,255,255,.55) 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 34% 70%,rgba(255,255,255,.4) 50%,transparent 51%),
    radial-gradient(2.4px 2.4px at 58% 20%,rgba(255,255,255,.5) 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 76% 60%,rgba(255,255,255,.35) 50%,transparent 51%),
    radial-gradient(2px 2px at 90% 40%,rgba(255,255,255,.45) 50%,transparent 51%);
  animation:snow 9s linear infinite}
body::after{animation-duration:14s;animation-delay:-5s;opacity:.55;transform:scaleX(-1)}
@keyframes snow{to{transform:translateY(150vh)}}
@media (prefers-reduced-motion: reduce){body::before,body::after,.badge{animation:none}}
/* 底部山影 */
.mtns{position:fixed;left:0;right:0;bottom:0;height:26vh;pointer-events:none;opacity:.55}
/* 玻璃卡片 */
#lock{position:relative;width:min(340px,88vw);padding:38px 28px 26px;text-align:center;
  background:linear-gradient(180deg,rgba(28,44,74,.72),rgba(16,27,48,.8));
  border:1px solid rgba(130,170,230,.16);border-radius:22px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.badge{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#3f7ec2,#2b5c99);
  box-shadow:0 8px 24px rgba(47,107,176,.45),inset 0 1px 0 rgba(255,255,255,.25);
  animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.badge svg{width:28px;height:28px;fill:none;stroke:#eaf3ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lock h1{margin:0 0 22px;font-size:19px;font-weight:700;color:#eaf1fc;letter-spacing:2px}
.row{display:flex;gap:9px}
#pw{flex:1;min-width:0;padding:12px 14px;font-size:16px;color:#eaf1fc;background:rgba(9,16,30,.65);
  border:1px solid rgba(120,155,215,.25);border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s}
#pw::placeholder{color:#5d7295}
#pw:focus{border-color:#4d8bd6;box-shadow:0 0 0 3px rgba(77,139,214,.22)}
#go{padding:12px 18px;font-size:15px;font-weight:600;color:#fff;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#4d8bd6,#2f6bb0);box-shadow:0 6px 18px rgba(47,107,176,.4);
  transition:transform .12s;font-family:inherit;-webkit-tap-highlight-color:transparent}
#go:active{transform:scale(.96)}
#msg{min-height:22px;margin-top:16px;color:#8ba3c7;font-size:13px;letter-spacing:.5px}
#msg.err{color:#eb9c7d}
#msg:not(.err):not(:empty){animation:breath 1.6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:1}50%{opacity:.45}}
.dot{margin-top:18px;color:#44597e;font-size:11px;letter-spacing:4px}
/* 自动解锁启动态:本机存有密钥时先藏起口令卡只留转圈,免得刷新先闪一下解锁界面再消失 */
#boot{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
html.boot #boot{display:flex}
html.boot #lock{display:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(130,170,230,.18);border-top-color:#6ea8e8;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
</style></head><body>
<script>try{document.documentElement.className='boot';}catch(_){}</script>   <!-- 无口令模式:始终启动自动解锁(口令内置壳页),打开即看 -->

  <path d="M0,150 L0,112 L48,76 L96,108 L142,34 L192,88 L236,58 L278,98 L326,44 L372,86 L422,60 L480,102 L480,150 Z" fill="rgba(18,30,54,.9)"/>
</svg>

function parseIb(b64){   // 壳页内嵌数据副本(base64) → {salt,nonce,ct};大陆访问 github.io 不稳,壳页到手即有数据
  var bin = atob(b64), d = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++){ d[i] = bin.charCodeAt(i); }
  if(!(d.length > 31 && d[0] === 87 && d[1] === 76 && d[2] === 49)) throw new Error('fmt');
  return { salt: d.slice(3, 19), nonce: d.slice(19, 31), ct: d.slice(31) };
}
function fetchParts(fresh){
  if(!fresh && window.__IB__){ return Promise.resolve().then(function(){ return parseIb(window.__IB__); }); }
  var url = fresh ? ('i.b?_=' + Date.now()) : 'i.b';   // 时间戳参数绕缓存:微信等 webview 对 fetch cache:'reload' 兼容差(请求会挂起)
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    var d = new Uint8Array(buf);
    if(!(d.length > 31 && d[0] === 87 && d[1] === 76 && d[2] === 49)) throw new Error('fmt');
    return { salt: d.slice(3, 19), nonce: d.slice(19, 31), ct: d.slice(31) };
  });
}
function deriveKey(pw, salt){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
    .then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'}, k, 256);
    });
}
function openPage(raw, parts){
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:parts.nonce}, k, parts.ct);
  }).then(function(pt){
    return { raw: raw, html: new TextDecoder().decode(pt) };
  });
}
function toHex(buf){ var u = new Uint8Array(buf), s = '', i; for(i = 0; i < u.length; i++){ s += (u[i] < 16 ? '0' : '') + u[i].toString(16); } return s; }
function fromHex(s){ var u = new Uint8Array(s.length / 2), i; for(i = 0; i < u.length; i++){ u[i] = parseInt(s.substr(i * 2, 2), 16); } return u.buffer; }
function renderPage(res){
  var html = res.html.split('src="images/').join('data-psrc="images/');
  if(html.indexOf('</body>') >= 0){ html = html.replace('</body>', LOADER + '</body>'); }
  window.__PK = res.raw;   // document.open/write 不换 window,密钥位给注入的图片加载器用
  document.open();
  document.write(html);
  document.close();
}
var msgEl = document.getElementById('msg');
function fail(t){

}
function withTimeout(pr, ms, tag){   // 兜底:个别 webview(如微信)请求可能挂起不落地,超时转为报错而不是永远转圈
  return Promise.race([
    pr,
    new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout:' + tag)); }, ms); })
  ]);

function unlock(){
  var pw = document.getElementById('pw').value || 'wanlong';   // 无口令模式:留空也按内置口令试,按钮当"重试"用
  msgEl.className = ''; msgEl.textContent = '正在重试，稍候…';
  withTimeout(fetchParts(true), 12000, 'unlock')
    .then(function(p){ return deriveKey(pw, p.salt).then(function(raw){ return openPage(raw, p); }); })
    .then(function(res){
      try{ localStorage.setItem('wl-pk', toHex(res.raw)); }catch(e){}   // 记住本设备(存派生密钥,不存口令):下次免输

(function(){   // 无口令模式:口令内置在壳页里自动解锁——有链接即可看;
